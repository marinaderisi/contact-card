<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1426" />
  <meta name="description" content="Marina DeRisi — Electrical & Computer Engineering, NYU Tandon." />
  <title>Marina DeRisi | Engineering Contact</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #0b1426;
      --text: #f3f6fc;
      --secondary: #bac7dc;
      --accent: #a9c7f8;
      --line: #31435e;
      --tag: #1d2e48;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--navy);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100% - 40px, 480px); margin: 0 auto; padding: clamp(45px, 9vh, 100px) 0 48px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 50px; color: var(--accent); }
    header span { font-size: 11px; font-weight: 600; letter-spacing: .12em; }
    header svg { width: 22px; height: 22px; flex-shrink: 0; }
    h1 { font-size: clamp(30px, 6vw, 38px); font-weight: 650; letter-spacing: -.035em; line-height: 1.13; margin: 0 0 16px; }
    .degree { color: #d1dced; font-size: 17px; line-height: 1.4; margin: 0 0 8px; }
    .school { color: var(--secondary); font-size: 14px; line-height: 1.5; margin: 0; }
    .rule { height: 1px; background: var(--line); margin: 35px 0 27px; }
    h2 { color: var(--secondary); text-transform: uppercase; font-size: 11px; font-weight: 600; letter-spacing: .11em; margin: 0 0 16px; }
    ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 34px; }
    li { color: #dce7f8; background: var(--tag); border: 1px solid #334662; border-radius: 7px; font-size: 12.5px; line-height: 1.25; padding: 8px 11px; }
    a.linkedin { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 43px; padding: 0 18px; background: #dce7fa; border-radius: 7px; color: #17243e; text-decoration: none; font-size: 13px; font-weight: 650; transition: background .15s ease; }
    a.linkedin svg { width: 16px; height: 16px; }
    a.linkedin:hover { background: #fff; }
    a.linkedin:focus-visible { outline: 3px solid #8cb8ff; outline-offset: 3px; }
    @media (max-width: 420px) {
      main { width: calc(100% - 36px); padding-top: 40px; }
      header { margin-bottom: 43px; }
      h1 { font-size: 32px; }
      .degree { font-size: 16px; }
      .school { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { a.linkedin { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx=".7"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/></svg>
      <span>ENGINEERING / CONTACT</span>
    </header>
    <section aria-label="Contact identity">
      <h1>Marina DeRisi</h1>
      <p class="degree">Electrical &amp; Computer Engineering</p>
      <p class="school">NYU Tandon · Class of 2028</p>
    </section>
    <div class="rule" aria-hidden="true"></div>
    <section aria-labelledby="interests">
      <h2 id="interests">Areas of Interest</h2>
      <ul>
        <li>Embedded Systems</li>
        <li>Sensors &amp; Instrumentation</li>
        <li>Cybersecurity</li>
        <li>Optics</li>
      </ul>
    </section>
    <a class="linkedin" href="https://www.linkedin.com/in/marina-derisi" target="_blank" rel="noopener noreferrer" aria-label="View Marina DeRisi on LinkedIn">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.899 1.637-1.85 3.37-1.85 3.6 0 4.264 2.37 4.264 5.455v6.286ZM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124ZM7.119 20.452H3.555V9h3.564v11.452ZM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003Z"/></svg>
      LinkedIn
    </a>
  </main>
</body>
</html>
